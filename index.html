<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Афиша: установка виджета</title>
<style>
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; margin: 0; padding: 20px; color: #222; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  .info { background: #f2f3f5; border-radius: 10px; padding: 10px 14px; margin-bottom: 16px; font-size: 14px; }
  button { background: #2787f5; color: #fff; border: 0; border-radius: 8px; padding: 12px 18px; font-size: 15px; cursor: pointer; margin: 6px 6px 6px 0; }
  textarea { width: 100%; height: 90px; font-size: 13px; margin-top: 8px; }
  #log { margin-top: 14px; font-size: 14px; white-space: pre-wrap; }
  .warn { color: #c0392b; }
</style>
<script src="https://cdn.jsdelivr.net/npm/@vkontakte/vk-bridge@2/dist/browser.min.js"></script>
</head>
<body>
<h1>Установка виджета афиши</h1>
<div class="info" id="info"></div>

<p><b>Шаг 1.</b> Получить ключ сообщества (разрешите доступ в окне ВК), затем скопируйте его из поля:</p>
<button id="btnToken">Получить ключ</button>
<textarea id="token" placeholder="Здесь появится ключ" readonly></textarea>

<p><b>Шаг 2.</b> Добавить виджет на страницу сообщества (потом бот сам заменит его содержимое):</p>
<button id="btnWidget">Установить виджет</button>

<div id="log"></div>

<script>
  const q = new URLSearchParams(location.search);
  const APP_ID = Number(q.get('vk_app_id') || 0);
  const GROUP_ID = Number(q.get('vk_group_id') || 0);
  const $ = (id) => document.getElementById(id);
  const log = (t, bad) => { $('log').innerHTML = '<span class="' + (bad ? 'warn' : '') + '">' + t + '</span>'; };

  $('info').textContent = 'ID приложения: ' + (APP_ID || '—') + ' | ID сообщества: ' + (GROUP_ID || '—');
  if (!GROUP_ID) log('Откройте приложение из сообщества (Управление → Приложения → ваше приложение), иначе ID сообщества не определится.', true);

  vkBridge.send('VKWebAppInit').catch(() => {});

  $('btnToken').onclick = async () => {
    try {
      const r = await vkBridge.send('VKWebAppGetCommunityAuthToken', {
        app_id: APP_ID, group_id: GROUP_ID, scope: 'app_widget'
      });
      $('token').value = r.access_token;
      log('Ключ получен. Скопируйте его и сохраните в файл vk_widget_token.txt.');
    } catch (e) {
      log('Не удалось получить ключ: ' + JSON.stringify(e), true);
    }
  };

  $('btnWidget').onclick = async () => {
    const code = 'return {"title":"Афиша","more":"Вся афиша","more_url":"https://teatralno.ru/",' +
                 '"rows":[{"title":"Виджет подключён","descr":"Скоро здесь появится афиша"}]};';
    try {
      await vkBridge.send('VKWebAppShowCommunityWidgetPreviewBox', { group_id: GROUP_ID, type: 'list', code: code });
      log('Виджет добавлен. Теперь его будет обновлять скрипт.');
    } catch (e) {
      log('Не удалось добавить виджет: ' + JSON.stringify(e), true);
    }
  };
</script>
</body>
</html>
